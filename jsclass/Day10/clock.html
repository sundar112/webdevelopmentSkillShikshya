<!-- @format -->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="input.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	</head>
	<body
		class="min-h-screen flex flex-col items-center justify-center bg-gray-900">
		<div class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm">
			<h1 class="text-center text-2xl font-bold text-blue-900">Stopwatch</h1>
			<div id="time" class="flex justify-center gap-3 text-4xl">
				<span class="digit" id="hr"> 00</span>
				<span>:</span>
				<span class="digit" id="min"> 00</span>
				<span>:</span>
				<span class="digit" id="sec"> 00</span>
				<span>:</span>
				<span class="digit" id="count"> 00 </span>
			</div>
			<div class="flex justify-between mt-4">
				<button
					id="stop"
					class="bg-red-500 text-white h-15 w-15 px-4 py-4 rounded-[50%] cursor-pointer hover:bg-red-700 transition">
					stop
				</button>

				<button
					id="reset"
					class="bg-orange-500 text-white h-15 w-15 px-4 py-4 rounded-[50%] cursor-pointer hover:bg-orange-700 transition">
					reset
				</button>

				<button
					id="start"
					class="bg-blue-600 text-white h-15 w-15 px-4 py-4 rounded-[50%] cursor-pointer hover:bg-blue-700 transition">
					start
				</button>

				<button
					id="lap"
					class="bg-green-500 text-white h-15 w-15 px-4 py-4 rounded-[50%] cursor-pointer hover:bg-green-700 transition"
					disabled>
					lap
				</button>
			</div>
		</div>
		<!----------------------- time lap list from hear ----------------------->

		<div
			class="mt-3 h-96 mx-auto bg-white p-6 rounded-lg shadow-md w-full max-w-sm max-h-64 overflow-y-auto">
			<ul id="lapList" class="space-y-2"></ul>
			<button
				id="clearBtn"
				class="bg-blue-500 px-4 py-2 text-white rounded cursor-pointer hover:bg-blue-700 transition"
				hidden>
				Clear
			</button>
		</div>

		<script src="clock.js"></script>
	</body>
</html>
