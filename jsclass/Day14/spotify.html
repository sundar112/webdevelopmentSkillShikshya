<!-- @format -->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
			integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer" />
		<link rel="icon" href="./assets/logo.png" />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;500;600;700&display=swap"
			rel="stylesheet" />
		<title>Spotify - Web Player: Music for everyone</title>
		<link rel="stylesheet" href="./spotify.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	</head>
	<body class="bg-black text-white overflow-hidden m-0 font-montserrat">
		<div class="mian flex h-screen p-2">
			<div class="sidebar bg-black w-85 pr-2">
				<div
					class="nav bg-[#121212] rounded-2xl flex flex-col justify-center h-25 px-2 py-3">
					<div
						class="navOption leading-10 opacity-[0.5] py-2 px-[0.7rem] hover:opacity-100">
						<i class="fa-solid fa-house"></i>
						<a href="#">Home</a>
					</div>
					<div
						class="nav_option leading-10 opacity-[0.5] py-2 px-[0.7rem] hover:opacity-100">
						<i class="fa-solid fa-magnifying-glass"></i>
						<a href="#">Search</a>
					</div>
				</div>
				<div
					class="library bg-[#121212] rounded-2xl flex flex-col h-full mt-2 py-2 px-3">
					<div class="options flex justify-between items-center">
						<div
							class="libOptions flex gap-4 text-[20px] font-semibold opacity-50 hover:opacity-100">
							<img class="h-7" src="./assets/library_icon.png" alt="" />
							<a href="#">Your Library</a>
						</div>
						<div class="icons text-2xl flex gap-4">
							<i class="fa-solid fa-plus opacity-50 hover:opacity-100"></i>
							<i
								class="fa-solid fa-arrow-right opacity-50 hover:opacity-100"></i>
						</div>
					</div>
					<div class="libBox mt-6">
						<div class="box">
							<p class="box_p1">Create your first playlist</p>
							<p class="box_p2">It's easy, we'll help you</p>
							<button class="badge">Create playlist</button>
						</div>
						<div class="box">
							<p class="box_p1">Let's find some podcast to follow</p>
							<p class="box_p2">We'll keep you updated on episodes</p>
							<button class="badge">Browse podcast</button>
						</div>
					</div>
				</div>
			</div>
			<div
				class="mainContent bg-[#121212] flex-1 rounded-2xl overflow-auto px-2">
				<div
					class="stikyNav flex justify-between items-center sticky to-0% bg-[#121212] p-4 z-10">
					<div class="stikyNamvIcons flex h-6 w-6">
						<img src="./assets/backward_icon.png" alt="" />
						<img src="./assets/forward_icon.png" alt="" />
					</div>
					<div class="stikyNavOptions flex justify-center items-center gap-6">
						<button class="bg-white text-black rounded-2xl p-1.5">
							Explore Preminum
						</button>
						<button class="bg-black p-1.5 rounded-2xl">
							<i class="fa-regular fa-circle-down" style="margin-right: 5px"></i
							>Install App
						</button>
						<i class="fa-regular fa-user border p-1.5 rounded-4xl"></i>
					</div>
				</div>

				<h2 class="text-4xl font">New Released</h2>

				<div
					id="albumContainer"
					class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>

				<!-- Template -->
				<template id="albumTemplate">
					<div class="bg-gray-900 rounded-lg p-3 hover:bg-gray-800 transition">
						<img class="w-full h-40 object-cover rounded-md mb-3" />
						<div class="flex justify-between">
							<div class="overflow-auto flex-1 min-w-0">
								<h2 class="font-semibold text-sm truncate"></h2>
								<p class="text-xs text-gray-400"></p>
							</div>
							<button
								class="w-9 h-9 flex items-center justify-center rounded-full bg-green-500 hover:bg-green-400 transition">
								▶
							</button>
						</div>
					</div>
				</template>

				<h2 class="text-4xl font mt-10">Recently Played</h2>
				<div
					id="albumContainer2"
					class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
				<template id="albumTemplate">
					<div class="bg-gray-900 rounded-lg p-3 hover:bg-gray-800 transition">
						<img class="w-full h-40 object-cover rounded-md mb-3" />
						<div class="flex justify-between">
							<div class="overflow-auto flex-1 min-w-0">
								<h2 class="font-semibold text-sm truncate"></h2>
								<p class="text-xs text-gray-400"></p>
							</div>
							<button
								class=" playbtn w-9 h-9 flex items-center justify-center rounded-full bg-green-500 hover:bg-green-400 transition">
								▶
							</button>
						</div>
					</div>
				</template>
			</div>
		</div>
		<div class="music_player">
        <div class="album">
          <div class="album_content">
            <img src="./assets/card2img.jpeg" class="album_img">
            <div class="song_info">
              <a class="album_title">Sarangi</a>
              <a class="album_info">Susant KC</a>
            </div>
            </i><i class="fa-solid fa-circle-plus icons"></i>
          </div>
        </div>
        <div class="player">
            <div class="player_controls">
                <img src="./assets/player_icon1.png" class="player_control_icon">
                <img src="./assets/player_icon2.png" class="player_control_icon">
                <img src="./assets/player_icon3.png" id="playBtn" class=" playbtn player_control_icon play_icon">
                <img src="./assets/player_icon4.png" class="player_control_icon">
                <img src="./assets/player_icon5.png" class="player_control_icon">
            </div>
            <div class="playback_bar">
                <!-- <span class="curr_time">00:00</span> -->
				 <span class="curr_time" id="currentTime">00:00</span>
                <input type="range"
       min="0"
       max="100"
       value="0"
       class="progress_bar"
       id="progressBar">
                
<span class="tot_time" id="totalTime">00:00</span>
            </div>
        </div>
        <div class="control">
          
        </div>
      </div>

		<script src="spotify.js"></script>
		<script src="player.js"></script>
	</body>
</html>
